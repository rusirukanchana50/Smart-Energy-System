# ==============================================================================
# University of Ruhuna - Faculty of Engineering
# Smart Energy Monitoring and Analytics System (Spring Boot Backend)
# Application Configuration (application.properties)
# ==============================================================================

# Application Identity
spring.application.name=ruhuna-smart-energy-system

# Server Port Configuration
# Set to 5001 so the existing Node.js backend on port 5000 remains uninterrupted
server.port=5001

# Isolated MongoDB Database Configuration (Development Database)
# Strict isolation: points to 'ruhuna_energy_spring' on port 27018, never touching 'ruhuna_energy' on port 27017
spring.data.mongodb.uri=mongodb://127.0.0.1:27018/ruhuna_energy_spring

# Session & Cookie Configuration (Local Development)
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# ==============================================================================
# Automatic Energy Simulation Scheduler Configuration (Phase 5B-5A)
# Strict safety: DISABLED by default until explicitly approved and enabled
# ==============================================================================
simulator.enabled=false
simulator.interval.ms=15000
simulator.initial-delay.ms=5000

